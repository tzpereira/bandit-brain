services:
  backend:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_URL: ${API_URL}
      HASH_SECRET_KEY: ${HASH_SECRET_KEY}
      HASH_ALGORITHM: ${HASH_ALGORITHM}
      HASH_TOKEN_EXPIRE_MINUTES: ${HASH_TOKEN_EXPIRE_MINUTES}
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - bandit-net

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      API_URL: ${API_URL}
    networks:
      - bandit-net

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - bandit-net

volumes:
  db_data:

networks:
  bandit-net:
    driver: bridge
